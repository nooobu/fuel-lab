// ─── CSV parser (Garmin / Strava — summary row OR multi-lap rows) ──────────
function parseActivityCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return null;

  // Auto-detect delimiter (comma or semicolon)
  const delim = lines[0].split(";").length > lines[0].split(",").length ? ";" : ",";
  const headers = lines[0].split(delim).map(h => h.trim().replace(/"/g, ""));

  const dataLines = lines
    .slice(1)
    .filter(l => l.trim().length > 3 && !l.trim().startsWith("#"));
  if (dataLines.length === 0) return null;

  // Parse one CSV row → object (handles quoted fields containing the delimiter)
  const parseRow = (line) => {
    const vals = [];
    let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === delim && !inQ) { vals.push(cur.trim()); cur = ""; }
      else { cur += c; }
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => { obj[h] = vals[i] != null ? vals[i] : ""; });
    return obj;
  };

  // Flexible column lookup (case-insensitive partial match)
  const getCol = (row, ...keys) => {
    for (const k of keys) {
      if (row[k] !== undefined && row[k] !== "") return row[k];
      // Case-insensitive fallback
      const found = Object.keys(row).find(h => h.toLowerCase().includes(k.toLowerCase()));
      if (found && row[found] !== "") return row[found];
    }
    return "";
  };

  // Parse "H:MM:SS", "MM:SS", or "H:MM:SS.s" → decimal minutes
  const toMins = (s) => {
    if (!s) return 0;
    const parts = s.replace(/\.\d+$/, "").split(":").map(Number);
    if (parts.length === 3) return parts[0] * 60 + parts[1] + parts[2] / 60;
    if (parts.length === 2) return parts[0] + parts[1] / 60;
    return 0;
  };

  const toFloat = (s) => parseFloat((s || "0").replace(",", ".")) || 0;
  const toInt   = (s) => parseInt((s || "0").replace(/[^0-9]/g, "")) || 0;

  // ── Single-row (activity summary) ──
  if (dataLines.length === 1) {
    const row = parseRow(dataLines[0]);
    const dist        = toFloat(getCol(row, "Distance", "距離"));
    const durationMins = toMins(getCol(row, "Time", "Duration", "Elapsed Time", "タイム"));
    const ascent      = toInt(getCol(row, "Total Ascent", "Elevation Gain", "累計上昇高度", "Ascent"));
    const avgHR       = toInt(getCol(row, "Avg HR", "Average HR", "Average Heart Rate", "平均心拍数"));
    const maxHR       = toInt(getCol(row, "Max HR", "Max Heart Rate", "最高心拍数"));
    const calories    = toInt(getCol(row, "Calories", "カロリー"));
    const title       = getCol(row, "Title", "Activity Name", "アクティビティ名", "Activity Type") || "トレーニングラン";
    const date        = getCol(row, "Date", "Start Time", "日付");
    if (dist === 0 && durationMins === 0) return null;
    return { title, date, dist, durationMins: Math.round(durationMins), ascent, avgHR, maxHR, calories };
  }

  // ── Multi-row (lap / split data) ──
  // Garmin lap CSVs include a "概要" (summary) footer row with authoritative totals.
  // Detect it first — if present, use it directly to avoid double-counting laps.
  const SUMMARY_KEYWORDS = ["概要", "summary", "合計", "total"];
  const isSummaryRow = (line) => {
    const firstVal = line.split(delim)[0].trim().replace(/"/g, "").toLowerCase();
    return SUMMARY_KEYWORDS.some(k => firstVal === k);
  };

  const summaryLine = dataLines.find(isSummaryRow);

  if (summaryLine) {
    // Use the summary row directly as the authoritative result
    const row = parseRow(summaryLine);
    const dist        = toFloat(getCol(row, "Distance", "距離"));
    const durationMins = toMins(getCol(row, "Time", "Moving Time", "Duration", "タイム", "累積時間"));
    const ascent      = toInt(getCol(row, "Elevation Gain", "Ascent", "Total Ascent", "累計上昇高度", "総上昇量"));
    const avgHR       = toInt(getCol(row, "Avg HR", "Average HR", "Average Heart Rate", "平均心拍数"));
    const maxHR       = toInt(getCol(row, "Max HR", "Max Heart Rate", "最高心拍数", "最大心拍数"));
    const calories    = toInt(getCol(row, "Calories", "カロリー"));
    if (dist === 0 && durationMins === 0) return null;
    return {
      title: "トレーニングラン",
      date: "",
      dist: Math.round(dist * 100) / 100,
      durationMins: Math.round(durationMins),
      ascent,
      avgHR,
      maxHR,
      calories,
    };
  }

  // No summary row found → aggregate lap rows (excluding any summary-like rows)
  let totalDist = 0, totalMins = 0, totalAscent = 0, totalCal = 0;
  let hrSum = 0, hrCount = 0, maxHR = 0;
  let title = "", date = "";

  dataLines.filter(l => !isSummaryRow(l)).forEach(line => {
    const row = parseRow(line);
    totalDist   += toFloat(getCol(row, "Distance", "距離"));
    totalMins   += toMins(getCol(row, "Time", "Moving Time", "Duration", "タイム", "Lap Time"));
    totalAscent += toInt(getCol(row, "Elevation Gain", "Ascent", "Total Ascent", "累計上昇高度", "総上昇量"));
    totalCal    += toInt(getCol(row, "Calories", "カロリー"));

    const hr  = toInt(getCol(row, "Avg HR", "Average HR", "Average Heart Rate", "平均心拍数"));
    const mhr = toInt(getCol(row, "Max HR", "Max Heart Rate", "最高心拍数", "最大心拍数"));
    if (hr > 0)  { hrSum += hr; hrCount++; }
    if (mhr > maxHR) maxHR = mhr;

    if (!title) title = getCol(row, "Title", "Name", "Activity Type", "Activity Name") || "";
    if (!date)  date  = getCol(row, "Date", "Start Time", "日付") || "";
  });

  if (totalDist === 0 && totalMins === 0) return null;
  return {
    title: title || "トレーニングラン",
    date,
    dist: Math.round(totalDist * 100) / 100,
    durationMins: Math.round(totalMins),
    ascent: totalAscent,
    avgHR: hrCount > 0 ? Math.round(hrSum / hrCount) : 0,
    maxHR,
    calories: totalCal,
  };
}

// ─── Analysis engine ───────────────────────────────────────────────────────
function computeAnalysis(runData, nutritionItems, symptoms, runType) {
  const hours = runData.durationMins / 60;
  const isTrail = runType === "trail";

  let totalCarbs = 0, totalWater = 0, totalSodium = 0;
  nutritionItems.forEach(item => {
    const p = NUTRITION_PRESETS.find(x => x.id === item.id);
    if (!p) return;
    const mult = p.unit === "ml" ? item.qty / p.defaultQty : item.qty;
    // Use user-edited values if present, fallback to preset defaults
    totalCarbs  += ((item.carbs  != null ? item.carbs  : p.carbs))  * mult;
    totalWater  += ((item.water  != null ? item.water  : p.water))  * mult;
    totalSodium += ((item.sodium != null ? item.sodium : p.sodium)) * mult;
  });

  const recCarbsH  = 60;
  const recWaterH  = isTrail ? 500 : 420;
  const recSodiumH = isTrail ? 650 : 500;
  const recCarbs  = recCarbsH  * hours;
  const recWater  = recWaterH  * hours;
  const recSodium = recSodiumH * hours;

  const carbScore   = nutritionItems.length === 0 ? 0 : Math.min(100, Math.round((totalCarbs  / recCarbs)  * 100));
  const waterScore  = nutritionItems.length === 0 ? 0 : Math.min(100, Math.round((totalWater  / recWater)  * 100));
  const sodiumScore = nutritionItems.length === 0 ? 0 : Math.min(100, Math.round((totalSodium / recSodium) * 100));
  const overallScore = Math.round((carbScore + waterScore + sodiumScore) / 3);

  const has = (id) => symptoms.some(s => s.id === id);
  const insights = [];

  if (waterScore < 75 || has("headache") || has("dizziness")) insights.push({
    type: "warn", icon: "💧", title: "水分が不足していました",
    detail: `摂取 ${Math.round(totalWater)}ml ／ 推奨 ${Math.round(recWater)}ml（${recWaterH}ml/時間）`,
    fix: "20〜30分ごとに150〜200mlをこまめに。のどが渇く前に飲む習慣を。",
  });

  if (carbScore < 75 || has("bonk") || has("fatigue")) insights.push({
    type: "warn", icon: "⚡", title: "糖質が不足していました",
    detail: `摂取 ${Math.round(totalCarbs)}g ／ 推奨 ${Math.round(recCarbs)}g（${recCarbsH}g/時間）`,
    fix: "45〜60分ごとにジェル1本（約25g）または固形物で補充を。",
  });

  if (sodiumScore < 75 || has("cramp") || has("headache")) insights.push({
    type: "warn", icon: "🧂", title: "ナトリウムが不足していました",
    detail: `摂取 ${Math.round(totalSodium)}mg ／ 推奨 ${Math.round(recSodium)}mg（${recSodiumH}mg/時間）`,
    fix: "30分ごとに塩タブ1〜2粒。スポーツドリンクと水を交互に飲むのも有効。",
  });

  if (has("cramp")) insights.push({
    type: "info", icon: "💊", title: "筋肉の攣りは電解質不足のシグナル",
    detail: "Na・K・Mgのバランスが乱れると攣りやすくなります。",
    fix: "Mg含有の電解質タブレットや、バナナ・ドライフルーツを補給に加えてみては。",
  });

  if (has("gi")) insights.push({
    type: "info", icon: "😟", title: "胃腸の不快感は補給の「密度」が原因かも",
    detail: "高糖度ジェルを短時間に連続摂取すると胃に負担がかかります。",
    fix: "ジェルは必ず水と一緒に。固形物・液体・ジェルを時間軸で分散させましょう。",
  });

  if (insights.length === 0 || (carbScore >= 80 && waterScore >= 80 && sodiumScore >= 80)) insights.push({
    type: "good", icon: "✅", title: "補給バランスは良好です！",
    detail: "三大栄養素すべてが推奨範囲内。素晴らしい。",
    fix: "このパターンをベースに、次のレース計画を立てましょう。",
  });

  return { totalCarbs: Math.round(totalCarbs), totalWater: Math.round(totalWater), totalSodium: Math.round(totalSodium), recCarbs: Math.round(recCarbs), recWater: Math.round(recWater), recSodium: Math.round(recSodium), carbScore, waterScore, sodiumScore, overallScore, insights };
}

function fmt(m) {
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
}

// ─── Main App ──────────────────────────────────────────────────────────────
function FuelLabOnboarding() {
  const [step, setStep] = useState(0);
  const [runType, setRunType] = useState(null);       // 'road' | 'trail' | 'both'
  const [profile, setProfile] = useState({ name: "", age: 30, height: 170, weight: 65 });
  const [runData, setRunData] = useState(null);
  const [manualMode, setManualMode] = useState(false);
  const [manualRun, setManualRun] = useState({ title: "", dist: 0, hours: 0, mins: 0, ascent: 0, avgHR: 0 });
  const [isParsingCSV, setIsParsingCSV] = useState(false);
  const [csvError, setCSVError] = useState(null);
  const [nutritionItems, setNutritionItems] = useState([]);
  const [feeling, setFeeling] = useState(3);
  const [symptoms, setSymptoms] = useState([]);
  const [analysis, setAnalysis] = useState(null);
  const [onboardingDone, setOnboardingDone] = useState(false);
  const csvInputRef = useRef(null);

  const TOTAL_STEPS = 6; // 1 welcome + 5 content steps

  function handleCSV(file) {
    if (!file) return;
    setIsParsingCSV(true);
    setCSVError(null);
    const reader = new FileReader();
    reader.onload = e => {
      const result = parseActivityCSV(e.target.result);
      if (result) { setRunData(result); setCSVError(null); }
      else setCSVError("CSVを読み取れませんでした。Garmin Activities CSVか手動入力をお試しください。");
      setIsParsingCSV(false);
    };
    reader.readAsText(file, "UTF-8");
  }

  function toggleNutrition(id) {
    setNutritionItems(prev => {
      const p = NUTRITION_PRESETS.find(x => x.id === id);
      if (prev.find(i => i.id === id)) return prev.filter(i => i.id !== id);
      return [...prev, { id, qty: p.defaultQty, carbs: p.carbs, sodium: p.sodium, water: p.water }];
    });
  }

  function updateQty(id, qty) {
    setNutritionItems(prev => prev.map(i => i.id === id ? { ...i, qty } : i));
  }

  function updateItemNutrition(id, field, raw) {
    const val = parseInt(raw, 10);
    if (isNaN(val) || val < 0) return;
    setNutritionItems(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));
  }

  function toggleSymptom(id) {
    setSymptoms(prev => {
      if (id === "none") return [{ id: "none", km: 0 }];
      const filtered = prev.filter(s => s.id !== "none");
      if (filtered.find(s => s.id === id)) return filtered.filter(s => s.id !== id);
      return [...filtered, { id, km: 0 }];
    });
  }

  function updateSymptomKm(id, km) {
    setSymptoms(prev => prev.map(s => s.id === id ? { ...s, km } : s));
  }

  function effectiveRunData() {
    if (runData) return runData;
    if (manualMode) {
      const durationMins = manualRun.hours * 60 + manualRun.mins;
      return { title: manualRun.title || "トレーニングラン", date: "", dist: manualRun.dist, durationMins, ascent: manualRun.ascent, avgHR: manualRun.avgHR, maxHR: 0, calories: 0 };
    }
    return null;
  }

  function handleToAnalysis() {
    const rd = effectiveRunData();
    if (rd) setAnalysis(computeAnalysis(rd, nutritionItems, symptoms, runType));
    setStep(6);
  }

  // Step guards
  const canProceed = [
    true,                                          // 0 welcome
    runType !== null,                              // 1 run type
    profile.name.trim().length > 0,               // 2 profile
    effectiveRunData() !== null,                   // 3 import
    true,                                          // 4 nutrition (optional)
    true,                                          // 5 symptoms (optional)
  ];

  if (onboardingDone) return <MainAppShell profile={profile} runType={runType} analysis={analysis} runData={effectiveRunData()} />;

  return (
    <div style={{
      minHeight: "100vh",
      background: "linear-gradient(165deg, #0a0e17 0%, #111827 40%, #1a1a2e 100%)",
      color: "#e2e8f0",
      fontFamily: "'Noto Sans JP', 'SF Pro Display', -apple-system, sans-serif",
      position: "relative", overflow: "hidden",
    }}>
      {/* Ambient glow */}
      <div style={{ position: "fixed", top: "-20%", right: "-10%", width: "50vw", height: "50vw", background: "radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%)", pointerEvents: "none" }}/>
      <div style={{ position: "fixed", bottom: "-20%", left: "-10%", width: "40vw", height: "40vw", background: "radial-gradient(circle, rgba(34,197,94,0.06) 0%, transparent 70%)", pointerEvents: "none" }}/>

      <div style={{ maxWidth: "480px", margin: "0 auto", padding: "0 0 80px", position: "relative", zIndex: 1 }}>

        {/* ── Header ── */}
        {step > 0 && (
          <div style={{ padding: "20px 20px 0", display: "flex", alignItems: "center", gap: "12px" }}>
            <button onClick={() => setStep(s => Math.max(0, s - 1))} style={{
              width: "32px", height: "32px", borderRadius: "8px", border: "none",
              background: "rgba(30,41,59,0.6)", color: "#94a3b8", cursor: "pointer", fontSize: "16px",
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>←</button>
            <div style={{ flex: 1, height: "4px", background: "rgba(30,41,59,0.8)", borderRadius: "2px", overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${(step / TOTAL_STEPS) * 100}%`, background: "linear-gradient(90deg, #22c55e, #6366f1)", borderRadius: "2px", transition: "width 0.4s ease" }}/>
            </div>
            <span style={{ fontSize: "11px", color: "#64748b", fontWeight: "600", minWidth: "32px", textAlign: "right" }}>{step}/{TOTAL_STEPS}</span>
          </div>
        )}

        {/* ── Step 0: Welcome ── */}
        {step === 0 && (
          <div style={{ padding: "60px 24px 24px", textAlign: "center" }}>
            <div style={{
              width: "72px", height: "72px", borderRadius: "20px", margin: "0 auto 20px",
              background: "linear-gradient(135deg, #22c55e, #059669)",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: "36px", boxShadow: "0 8px 32px rgba(34,197,94,0.35)",
            }}>⚡</div>
            <div style={{ fontSize: "28px", fontWeight: "900", letterSpacing: "-1px", color: "#f8fafc", marginBottom: "8px" }}>FUEL LAB</div>
            <div style={{ fontSize: "13px", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "32px" }}>Trail & Road Nutrition Planner</div>
            <p style={{ fontSize: "14px", color: "#94a3b8", lineHeight: 1.8, marginBottom: "40px", padding: "0 8px" }}>
              あなたの走りに合わせた補給プランを作成します。<br/>
              直近のランのデータをもとに、<strong style={{ color: "#e2e8f0" }}>何が足りていたか・いなかったか</strong>を分析し、<br/>
              パーソナライズされたプランを提案します。
            </p>
            <div style={{ display: "flex", flexDirection: "column", gap: "10px", padding: "0 12px" }}>
              {[
                { icon: "🏃", text: "ランタイプとプロフィール登録" },
                { icon: "📊", text: "過去のランデータをインポート" },
                { icon: "🔬", text: "補給と体調を分析・診断" },
                { icon: "📋", text: "あなた専用プランを作成" },
              ].map((item, i) => (

            {effectiveRunData() && (

                  <div key={preset.id} onClick={() => toggleNutrition(preset.id)} style={{

                        <div style={{ fontSize: "12px", color: "#94a3b8" }}>
                          {selected

                          </label>

                            <span style={{ fontSize: "9px", color: "#94a3b8", fontWeight: "600" }}>Na (mg/{preset.unit === "ml" ? `${preset.defaultQty}ml` : preset.unit})</span>
                            <input
                              type="number" min="0" max="9999" value={selected.sodium}
                              onChange={e => updateItemNutrition(preset.id, "sodium", e.target.value)}
                              style={{ width: "100%", padding: "4px 6px", borderRadius: "6px", border: "1px solid rgba(196,181,253,0.3)", background: "rgba(196,181,253,0.08)", color: "#c4b5fd", fontSize: "12px", fontWeight: "700", outline: "none", boxSizing: "border-box" }}
                            />
                          </label>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}

            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "8px" }}>STEP 5</div>
            <div style={{ fontSize: "22px", fontWeight: "800", color: "#f1f5f9", marginBottom: "6px" }}>そのランの体調は？</div>

                  { val: 3, icon: "😐", label: "普通" },

                    border: `1px solid ${feeling === f.val ? "rgba(34,197,94,0.4)" : "rgba(148,163,184,0.06)"}`,
                    display: "flex", flexDirection: "column", alignItems: "center", gap: "4px",
                  }}>
                    <span style={{ fontSize: "22px" }}>{f.icon}</span>
                    <span style={{ fontSize: "9px", color: feeling === f.val ? "#4ade80" : "#475569" }}>{f.label}</span>
                  </button>

            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
              {SYMPTOM_OPTIONS.map(opt => {
                const selected = symptoms.find(s => s.id === opt.id);
                return (
                  <div key={opt.id}>
                    <div onClick={() => toggleSymptom(opt.id)} style={{
                      display: "flex", alignItems: "center", gap: "12px",

                      background: selected ? (opt.id === "none" ? "rgba(34,197,94,0.08)" : "rgba(239,68,68,0.08)") : "rgba(30,41,59,0.4)",
                      border: `1px solid ${selected ? (opt.id === "none" ? "rgba(34,197,94,0.3)" : "rgba(239,68,68,0.2)") : "rgba(148,163,184,0.06)"}`,

                        width: "20px", height: "20px", borderRadius: "6px", border: "2px solid",
                        borderColor: selected ? (opt.id === "none" ? "#22c55e" : "#ef4444") : "rgba(148,163,184,0.2)",
                        background: selected ? (opt.id === "none" ? "#22c55e" : "#ef4444") : "transparent",
                        display: "flex", alignItems: "center", justifyContent: "center", fontSize: "10px",
                      }}>{selected ? "✓" : ""}</div>
                    </div>
                    {/* km input for non-none symptoms */}
                    {selected && opt.id !== "none" && (
                      <div style={{ paddingLeft: "48px", paddingTop: "6px" }} onClick={e => e.stopPropagation()}>
                        <label style={{ fontSize: "10px", color: "#64748b", display: "flex", alignItems: "center", gap: "8px" }}>
                          何km地点で？
                          <input type="number" value={selected.km || ""} onChange={e => updateSymptomKm(opt.id, +e.target.value)}
                            placeholder="10" min={0} style={{ ...inputStyle, width: "80px", padding: "6px 10px", fontSize: "13px" }} />
                          <span style={{ fontSize: "11px", color: "#64748b" }}>km</span>
                        </label>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <button onClick={handleToAnalysis} style={{
              marginTop: "28px", width: "100%", padding: "16px", borderRadius: "14px", border: "none",
              background: "linear-gradient(135deg, #22c55e, #059669)",
              color: "#fff", fontSize: "15px", fontWeight: "800", cursor: "pointer",
              boxShadow: "0 8px 24px rgba(34,197,94,0.3)",
            }}>分析・診断する 🔬</button>
          </div>
        )}

        {/* ── Step 6: Analysis ── */}
        {step === 6 && analysis && (
          <AnalysisStep
            analysis={analysis}
            profile={profile}
            runType={runType}
            runData={effectiveRunData()}
            symptoms={symptoms}
            feeling={feeling}
            onDone={() => setOnboardingDone(true)}
          />
        )}

      </div>
    </div>
  );
}

function NutritionTotals({ items }) {
  let carbs = 0, water = 0, sodium = 0;
  items.forEach(item => {
    const p = NUTRITION_PRESETS.find(x => x.id === item.id);
    if (!p) return;
    const mult = p.unit === "ml" ? item.qty / p.defaultQty : item.qty;
    carbs  += ((item.carbs  != null ? item.carbs  : p.carbs))  * mult;
    water  += ((item.water  != null ? item.water  : p.water))  * mult;
    sodium += ((item.sodium != null ? item.sodium : p.sodium)) * mult;
  });
  return (
    <div style={{ padding: "12px 14px", borderRadius: "12px", background: "rgba(30,41,59,0.5)", border: "1px solid rgba(148,163,184,0.08)", marginBottom: "4px" }}>
      <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "8px" }}>合計摂取量（このランの合計）</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", textAlign: "center" }}>
        <div><div style={{ fontSize: "16px", fontWeight: "800", color: "#fbbf24" }}>{Math.round(carbs)}g</div><div style={{ fontSize: "9px", color: "#64748b" }}>糖質</div></div>
        <div><div style={{ fontSize: "16px", fontWeight: "800", color: "#60a5fa" }}>{Math.round(water)}ml</div><div style={{ fontSize: "9px", color: "#64748b" }}>水分</div></div>
        <div><div style={{ fontSize: "16px", fontWeight: "800", color: "#c4b5fd" }}>{Math.round(sodium)}mg</div><div style={{ fontSize: "9px", color: "#64748b" }}>Na</div></div>
      </div>
    </div>
  );
}

function ScoreRing({ score, color, label }) {
  const r = 28, circ = 2 * Math.PI * r;
  const dash = (score / 100) * circ;
  return (
    <div style={{ textAlign: "center" }}>
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r={r} fill="none" stroke="rgba(148,163,184,0.1)" strokeWidth="6"/>
        <circle cx="36" cy="36" r={r} fill="none" stroke={color} strokeWidth="6"
          strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
          transform="rotate(-90 36 36)" style={{ transition: "stroke-dasharray 1s ease" }}/>
        <text x="36" y="40" textAnchor="middle" fill={color} fontSize="14" fontWeight="800">{score}</text>
      </svg>
      <div style={{ fontSize: "10px", color: "#64748b", marginTop: "2px" }}>{label}</div>
    </div>
  );
}

function StepperInput({ label, unit, value, min, max, step = 1, onChange }) {
  const btn = {
    width: "30px", height: "30px", borderRadius: "8px",
    border: "1px solid rgba(148,163,184,0.15)",
    background: "rgba(15,23,42,0.5)", color: "#94a3b8",
    fontSize: "18px", cursor: "pointer", lineHeight: "28px", padding: 0, textAlign: "center",
  };
  return (
    <div style={{ display: "flex", alignItems: "center", padding: "10px 0", borderBottom: "1px solid rgba(148,163,184,0.06)" }}>
      <div style={{ flex: 1, fontSize: "13px", color: "#94a3b8" }}>{label}</div>
      <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
        <button style={btn} onClick={() => onChange(Math.max(min, value - step))}>−</button>
        <div style={{ width: "52px", textAlign: "center", fontSize: "17px", fontWeight: "800", color: "#f1f5f9" }}>{value}</div>
        <button style={btn} onClick={() => onChange(Math.min(max, value + step))}>+</button>
        <div style={{ fontSize: "11px", color: "#475569", width: "34px" }}>{unit}</div>
      </div>
    </div>
  );
}

// ─── Plan Screen ────────────────────────────────────────────────────────────
function PlanScreen({ profile, runType, analysis, runData, onBack }) {
  const [tab, setTab] = useState("setup");
  const [dist, setDist] = useState(Math.round(runData?.dist ?? 15));
  const [pace, setPace] = useState(() => {
    if (runData?.durationMins && runData?.dist > 0) {
      return Math.max(3, Math.min(20, Math.round(runData.durationMins / runData.dist)));
    }
    return runType === "trail" ? 10 : 7;
  });
  const [ascent, setAscent] = useState(Math.round((runData?.ascent ?? 0) / 50) * 50);

  const estimatedMins = useMemo(
    () => Math.round(dist * pace + (ascent / 100) * 4),
    [dist, pace, ascent]
  );
  const hrs = estimatedMins / 60;

  const targetCarbsHr = (analysis?.carbScore ?? 70) < 65 ? 60 : 50;
  const targetWaterHr = runType === "trail" ? 500 : 400;
  const targetSodiumHr = (profile?.weight ?? 65) >= 70 ? 500 : 400;

  const timeline = useMemo(() => {
    const interval = estimatedMins <= 120 ? 20 : 30;
    const steps = [];
    for (let t = 0; t <= estimatedMins + interval / 2; t += interval) {
      const isStart = t === 0;
      const isFinish = t >= estimatedMins;
      const mins = isFinish ? estimatedMins : t;
      const items = [];

      if (isStart) {
        items.push({ id: "sports", qty: 500 });
      } else if (isFinish) {
        items.push({ id: "cola", qty: 150 });
      } else {
        const stepN = Math.round(t / interval);
        if (stepN % 2 === 0) {
          items.push({ id: "sports", qty: 300 });
        } else {
          items.push({ id: "gel", qty: 1 });
          items.push({ id: "water", qty: 200 });
        }
        if (t >= 90 && Math.round(t % 120) < interval) {
          items.push(runType === "trail"
            ? { id: "onigiri", qty: 1 }
            : { id: "salt", qty: 3 });
        }
      }

      steps.push({ mins, isStart, isFinish, items });
      if (isFinish) break;
    }
    return steps;
  }, [estimatedMins, runType]);

  const totals = useMemo(() => {
    let carbs = 0, water = 0, sodium = 0;
    timeline.forEach(step =>
      step.items.forEach(({ id, qty }) => {
        const p = NUTRITION_PRESETS.find(x => x.id === id);
        if (!p) return;
        const r = p.unit === "ml" ? qty / p.defaultQty : qty;
        carbs += p.carbs * r;
        water += p.water * r;
        sodium += p.sodium * r;
      })
    );
    return {
      carbsHr: hrs > 0 ? Math.round(carbs / hrs) : 0,
      waterHr: hrs > 0 ? Math.round(water / hrs) : 0,
      sodiumHr: hrs > 0 ? Math.round(sodium / hrs) : 0,
    };
  }, [timeline, hrs]);

  const bg = "linear-gradient(165deg, #0a0e17 0%, #111827 40%, #1a1a2e 100%)";
  const font = "'Noto Sans JP', 'SF Pro Display', -apple-system, sans-serif";
  const card = { ...cardBase, marginBottom: "12px" };

  return (
    <div style={{ minHeight: "100vh", background: bg, color: "#e2e8f0", fontFamily: font, maxWidth: "430px", margin: "0 auto" }}>
      <div style={{ position: "fixed", top: "-20%", right: "-10%", width: "50vw", height: "50vw", background: "radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%)", pointerEvents: "none" }} />

      {/* Header */}
      <div style={{ padding: "28px 20px 0" }}>
        <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "2px" }}>
          <button onClick={onBack} style={{ background: "none", border: "none", color: "#64748b", fontSize: "13px", cursor: "pointer", padding: "0 6px 0 0", fontWeight: "700" }}>← 戻る</button>
          <span style={{ fontSize: "20px" }}>⚡</span>
          <span style={{ fontSize: "16px", fontWeight: "900", letterSpacing: "-0.5px", color: "#f8fafc" }}>FUEL LAB</span>
        </div>
        <div style={{ fontSize: "11px", color: "#475569" }}>補給プラン作成</div>
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", margin: "16px 20px 0", background: "rgba(15,23,42,0.6)", borderRadius: "12px", padding: "4px" }}>
        {[["setup", "設定"], ["timeline", "タイムライン"]].map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)} style={{
            flex: 1, padding: "9px", borderRadius: "9px", border: "none",
            background: tab === key ? "rgba(99,102,241,0.25)" : "transparent",
            color: tab === key ? "#a5b4fc" : "#475569",
            fontSize: "12px", fontWeight: "700", cursor: "pointer",
          }}>{label}</button>
        ))}
      </div>

      <div style={{ padding: "16px 20px 60px" }}>

        {/* ── 設定タブ ── */}
        {tab === "setup" && (
          <>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "12px" }}>次回レース設定</div>

            <div style={card}>
              <StepperInput label="距離" unit="km" value={dist} min={1} max={200} onChange={setDist} />
              <StepperInput label="目標ペース" unit="分/km" value={pace} min={3} max={20} onChange={setPace} />
              <StepperInput label="獲得標高" unit="m" value={ascent} min={0} max={5000} step={50} onChange={setAscent} />
            </div>

            <div style={{ ...card, textAlign: "center", padding: "24px 16px" }}>
              <div style={{ fontSize: "10px", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "8px" }}>推定タイム</div>
              <div style={{ fontSize: "42px", fontWeight: "900", letterSpacing: "-2px", color: "#f8fafc" }}>{fmt(estimatedMins)}</div>
              <div style={{ fontSize: "11px", color: "#475569", marginTop: "4px" }}>{dist} km · ↑{ascent} m</div>
            </div>

            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "12px" }}>目標補給量 / 時間</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", marginBottom: "20px" }}>
              {[
                { label: "糖質", value: targetCarbsHr, unit: "g", color: "#fbbf24" },
                { label: "水分", value: targetWaterHr, unit: "ml", color: "#60a5fa" },
                { label: "Na", value: targetSodiumHr, unit: "mg", color: "#c4b5fd" },
              ].map(({ label, value, unit, color }) => (
                <div key={label} style={{ ...cardBase, textAlign: "center", padding: "14px 8px" }}>
                  <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "4px" }}>{label}</div>
                  <div style={{ fontSize: "22px", fontWeight: "900", color }}>{value}</div>
                  <div style={{ fontSize: "9px", color: "#475569" }}>{unit}/hr</div>
                </div>
              ))}
            </div>

            {analysis && (
              <div style={{ padding: "12px 14px", borderRadius: "12px", background: "rgba(99,102,241,0.08)", border: "1px solid rgba(99,102,241,0.15)", fontSize: "11px", color: "#94a3b8", lineHeight: 1.7, marginBottom: "20px" }}>
                前回スコア <strong style={{ color: "#a5b4fc" }}>{analysis.overallScore}</strong>/100 をもとに目標値を設定しました。
              </div>
            )}

            <button onClick={() => setTab("timeline")} style={{
              width: "100%", padding: "16px", borderRadius: "14px", border: "none",
              background: "linear-gradient(135deg, #6366f1, #8b5cf6)",
              color: "#fff", fontSize: "15px", fontWeight: "800", cursor: "pointer",
              boxShadow: "0 8px 24px rgba(99,102,241,0.35)",
            }}>タイムラインを確認する →</button>
          </>
        )}

        {/* ── タイムラインタブ ── */}
        {tab === "timeline" && (
          <>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "12px" }}>補給タイムライン</div>

            {/* 合計値 */}
            <div style={{ ...card, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", textAlign: "center", marginBottom: "16px" }}>
              {[
                { label: "糖質/h", value: totals.carbsHr, target: targetCarbsHr, unit: "g", color: "#fbbf24" },
                { label: "水分/h", value: totals.waterHr, target: targetWaterHr, unit: "ml", color: "#60a5fa" },
                { label: "Na/h", value: totals.sodiumHr, target: targetSodiumHr, unit: "mg", color: "#c4b5fd" },
              ].map(({ label, value, target, unit }) => {
                const ok = value >= target * 0.85 && value <= target * 1.2;
                const low = value < target * 0.85;
                return (
                  <div key={label}>
                    <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "2px" }}>{label}</div>
                    <div style={{ fontSize: "20px", fontWeight: "900", color: ok ? "#4ade80" : low ? "#fbbf24" : "#f87171" }}>{value}</div>
                    <div style={{ fontSize: "9px", color: "#475569" }}>目標 {target}{unit}</div>
                  </div>
                );
              })}
            </div>

            {/* タイムライン */}
            <div style={{ position: "relative" }}>
              <div style={{ position: "absolute", left: "21px", top: "20px", bottom: "20px", width: "2px", background: "rgba(99,102,241,0.12)" }} />
              {timeline.map((step, i) => (
                <div key={i} style={{ display: "flex", gap: "12px", marginBottom: "10px", alignItems: "flex-start" }}>
                  <div style={{ width: "44px", flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "center", gap: "3px" }}>
                    <div style={{
                      width: "12px", height: "12px", borderRadius: "50%", marginTop: "8px", zIndex: 1, position: "relative",
                      background: step.isStart || step.isFinish ? "#6366f1" : "rgba(99,102,241,0.4)",
                      border: `2px solid ${step.isStart || step.isFinish ? "#818cf8" : "rgba(99,102,241,0.3)"}`,
                      boxShadow: step.isStart || step.isFinish ? "0 0 8px rgba(99,102,241,0.6)" : "none",
                    }} />
                    <div style={{ fontSize: "9px", color: step.isStart || step.isFinish ? "#818cf8" : "#475569", fontWeight: "700" }}>
                      {fmt(step.mins)}
                    </div>
                  </div>
                  <div style={{
                    flex: 1, padding: "8px 12px", borderRadius: "12px",
                    background: step.isStart || step.isFinish ? "rgba(99,102,241,0.1)" : "rgba(30,41,59,0.4)",
                    border: `1px solid ${step.isStart || step.isFinish ? "rgba(99,102,241,0.2)" : "rgba(148,163,184,0.07)"}`,
                  }}>
                    {step.isStart && <div style={{ fontSize: "10px", color: "#818cf8", fontWeight: "700", marginBottom: "5px" }}>スタート</div>}
                    {step.isFinish && <div style={{ fontSize: "10px", color: "#818cf8", fontWeight: "700", marginBottom: "5px" }}>フィニッシュ</div>}
                    <div style={{ display: "flex", flexWrap: "wrap", gap: "5px" }}>
                      {step.items.map(({ id, qty }, j) => {
                        const p = NUTRITION_PRESETS.find(x => x.id === id);
                        if (!p) return null;
                        return (
                          <div key={j} style={{
                            padding: "3px 9px", borderRadius: "20px", fontSize: "11px", fontWeight: "600",
                            background: "rgba(99,102,241,0.12)", border: "1px solid rgba(99,102,241,0.18)", color: "#a5b4fc",
                            display: "flex", alignItems: "center", gap: "4px",
                          }}>
                            {p.icon} {p.name} <span style={{ color: "#64748b" }}>{qty}{p.unit}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <div style={{ marginTop: "12px", padding: "12px 14px", borderRadius: "12px", background: "rgba(15,23,42,0.4)", border: "1px solid rgba(148,163,184,0.06)", fontSize: "11px", color: "#475569", textAlign: "center" }}>
              スクリーンショットして当日に活用しよう 📸
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ─── Activity Card ───────────────────────────────────────────────────────────
function ActivityCard({ activity }) {
  const { runData, analysis } = activity;
  const score = analysis?.overallScore;
  const scoreColor = score >= 80 ? "#4ade80" : score >= 55 ? "#fbbf24" : "#f87171";
  return (
    <div style={{ ...cardBase, marginBottom: "10px", padding: "14px 16px" }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: "10px" }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: "13px", fontWeight: "700", color: "#f1f5f9", marginBottom: "6px" }}>
            {runData.title || "トレーニングラン"}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: "10px", fontSize: "11px", color: "#94a3b8" }}>
            <span>📍 {Math.round((runData.dist || 0) * 10) / 10}km</span>
            <span>⏱ {fmt(runData.durationMins)}</span>
            {runData.ascent > 0 && <span>↑{runData.ascent}m</span>}
            {runData.avgHR > 0 && <span>❤️ {runData.avgHR}bpm</span>}
          </div>
        </div>
        {score != null && (
          <div style={{ textAlign: "center", flexShrink: 0 }}>
            <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "2px" }}>スコア</div>
            <div style={{ fontSize: "20px", fontWeight: "900", color: scoreColor }}>{score}</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Dashboard Screen ────────────────────────────────────────────────────────
function DashboardScreen({ profile, runType, activities, onAddActivity, onPlan }) {
  const [period, setPeriod] = useState("weekly");
  const fileRef = useRef(null);

  const totalDist  = activities.reduce((s, a) => s + (a.runData?.dist || 0), 0);
  const totalMins  = activities.reduce((s, a) => s + (a.runData?.durationMins || 0), 0);
  const latestScore = activities.length > 0 ? (activities[activities.length - 1].analysis?.overallScore ?? "–") : "–";
  const runTypeLabel = runType === "trail" ? "🏔️ トレイルラン" : runType === "road" ? "🏙️ ロードラン" : "🔄 マルチスポーツ";

  const now = new Date();
  const cutoff = period === "weekly"
    ? new Date(now - 7  * 24 * 60 * 60 * 1000)
    : new Date(now - 30 * 24 * 60 * 60 * 1000);
  const periodActivities = activities.filter(a => a.addedAt >= cutoff);

  const bg   = "linear-gradient(165deg, #0a0e17 0%, #111827 40%, #1a1a2e 100%)";
  const font = "'Noto Sans JP', 'SF Pro Display', -apple-system, sans-serif";
  const card = { ...cardBase, marginBottom: "12px" };

  return (
    <div style={{ minHeight: "100vh", background: bg, color: "#e2e8f0", fontFamily: font, maxWidth: "430px", margin: "0 auto" }}>
      <div style={{ position: "fixed", top: "-20%", right: "-10%", width: "50vw", height: "50vw", background: "radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%)", pointerEvents: "none" }} />

      {/* Header */}
      <div style={{ padding: "28px 20px 0" }}>
        <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "2px" }}>
          <span style={{ fontSize: "20px" }}>⚡</span>
          <span style={{ fontSize: "16px", fontWeight: "900", letterSpacing: "-0.5px", color: "#f8fafc" }}>FUEL LAB</span>
        </div>
        <div style={{ fontSize: "11px", color: "#475569" }}>プロフィールダッシュボード</div>
      </div>

      <div style={{ padding: "16px 20px 80px" }}>

        {/* Profile card */}
        <div style={{ ...card, display: "flex", alignItems: "center", gap: "14px", padding: "18px 16px" }}>
          <div style={{
            width: "44px", height: "44px", borderRadius: "14px", flexShrink: 0,
            background: "linear-gradient(135deg, #6366f1, #8b5cf6)",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: "20px", fontWeight: "900", color: "#fff",
          }}>
            {(profile.name || "?")[0]}
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: "15px", fontWeight: "800", color: "#f1f5f9" }}>{profile.name}</div>
            <div style={{ fontSize: "11px", color: "#64748b", marginTop: "2px" }}>{runTypeLabel}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "2px" }}>最新スコア</div>
            <div style={{
              fontSize: "24px", fontWeight: "900",
              color: latestScore >= 80 ? "#4ade80" : latestScore >= 55 ? "#fbbf24" : "#f87171",
            }}>{latestScore}</div>
          </div>
        </div>

        {/* Summary stats */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", marginBottom: "20px" }}>
          {[
            { label: "トレーニング", value: activities.length, unit: "回" },
            { label: "総距離", value: `${Math.round(totalDist * 10) / 10}`, unit: "km" },
            { label: "総時間", value: fmt(totalMins), unit: "" },
          ].map(({ label, value, unit }) => (
            <div key={label} style={{ ...cardBase, textAlign: "center", padding: "12px 8px" }}>
              <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "4px" }}>{label}</div>
              <div style={{ fontSize: unit ? "18px" : "13px", fontWeight: "900", color: "#f1f5f9" }}>{value}</div>
              {unit && <div style={{ fontSize: "9px", color: "#475569" }}>{unit}</div>}
            </div>
          ))}
        </div>

        {/* Period toggle + log header */}
        <div style={{ display: "flex", alignItems: "center", marginBottom: "12px" }}>
          <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", flex: 1 }}>
            TRAINING LOG <span style={{ color: "#334155", fontWeight: "400" }}>({periodActivities.length}件)</span>
          </div>
          <div style={{ display: "flex", background: "rgba(15,23,42,0.6)", borderRadius: "8px", padding: "3px" }}>
            {[["weekly", "Weekly"], ["monthly", "Monthly"]].map(([key, label]) => (
              <button key={key} onClick={() => setPeriod(key)} style={{
                padding: "4px 10px", borderRadius: "6px", border: "none",
                background: key === period ? "rgba(99,102,241,0.25)" : "transparent",
                color: key === period ? "#a5b4fc" : "#475569",
                fontSize: "10px", fontWeight: "700", cursor: "pointer",
              }}>{label}</button>
            ))}
          </div>
        </div>

        {/* Activity list */}
        {periodActivities.length === 0 ? (
          <div style={{ ...cardBase, textAlign: "center", padding: "24px", color: "#475569", fontSize: "12px", marginBottom: "12px" }}>
            この期間のトレーニングはありません
          </div>
        ) : (
          periodActivities.map(act => <ActivityCard key={act.id} activity={act} />)
        )}

        {/* Add activity */}
        <input ref={fileRef} type="file" accept=".csv" style={{ display: "none" }}
          onChange={e => { if (e.target.files[0]) { onAddActivity(e.target.files[0]); e.target.value = ""; } }} />
        <button onClick={() => fileRef.current.click()} style={{
          width: "100%", padding: "14px", borderRadius: "14px",
          border: "1px dashed rgba(148,163,184,0.2)", background: "rgba(30,41,59,0.3)",
          color: "#64748b", fontSize: "13px", fontWeight: "700", cursor: "pointer", marginBottom: "20px",
        }}>
          + トレーニングログを追加
        </button>

        {/* Plan CTA */}
        <button onClick={onPlan} style={{
          width: "100%", padding: "16px", borderRadius: "14px", border: "none",
          background: "linear-gradient(135deg, #6366f1, #8b5cf6)",
          color: "#fff", fontSize: "15px", fontWeight: "800", cursor: "pointer",
          boxShadow: "0 8px 24px rgba(99,102,241,0.35)",
        }}>プランを作成する →</button>
      </div>
    </div>
  );
}

// ─── Main App Shell (navigation shell) ──────────────────────────────────────
function MainAppShell({ profile, runType, analysis, runData }) {
  const [view, setView] = useState("dashboard");
  const [activities, setActivities] = useState([{ id: 1, runData, analysis, addedAt: new Date() }]);

  function handleAddActivity(file) {
    const reader = new FileReader();
    reader.onload = e => {
      const result = parseActivityCSV(e.target.result);
      if (result) {
        const newAnalysis = computeAnalysis(result, [], [], runType);
        setActivities(prev => [...prev, { id: Date.now(), runData: result, analysis: newAnalysis, addedAt: new Date() }]);
      }
    };
    reader.readAsText(file, "UTF-8");
  }

  if (view === "plan") return <PlanScreen profile={profile} runType={runType} analysis={analysis} runData={runData} onBack={() => setView("dashboard")} />;
  return <DashboardScreen profile={profile} runType={runType} activities={activities} onAddActivity={handleAddActivity} onPlan={() => setView("plan")} />;
}


ReactDOM.createRoot(document.getElementById("root")).render(<FuelLabOnboarding />);

  </script>
</body>
